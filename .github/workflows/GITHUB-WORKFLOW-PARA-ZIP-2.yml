name: Compilar StagePads a partir do ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - 'StagePads-GitHub.zip'
      - '.github/workflows/build-from-zip.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto ZIP
        run: unzip -q StagePads-GitHub.zip -d extracted
      - name: Compilar APK
        working-directory: extracted/StagePads
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StagePads-APK
          path: extracted/StagePads/app/build/outputs/apk/debug/*.apk
